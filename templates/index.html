<!DOCTYPE html>
<html>
<head>
    <title>Mutual Fund Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #loadingSpinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        th .sort-buttons {
            display: flex;
            flex-direction: column;
            gap: 2px;
            justify-content: center;
            align-items: center;
        }
        th .sort-btn {
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border: none;
            background: none;
            line-height: 1;
            transition: background-color 0.2s;
        }
        th .sort-btn.asc::after {
            content: '↑';
        }
        th .sort-btn.desc::after {
            content: '↓';
        }
        th .sort-btn:hover {
            background-color: #e9ecef;
            border-radius: 3px;
        }
        th .sort-btn.active {
            background-color: #d1e7dd;
            font-weight: bold;
        }
        th {
            vertical-align: middle;
        }
        .share-cell {
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .share-cell:hover {
            background-color: #f1f3f5;
        }
        .table-container {
            overflow-x: auto;
            max-width: 100%;
            position: relative;
        }
        .share-funds-row {
            background-color: #f8f9fa;
        }
        .share-funds-container {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            overflow-x: auto;
            width: 100%;
        }
        .share-funds-container.show {
            display: block;
        }
        .main-table, .share-funds-table {
            width: 100%;
            table-layout: fixed;
            min-width: max-content;
        }
        .main-table th:not(:nth-child(-n+2)),
        .share-funds-table th:not(:nth-child(-n+2)) {
            width: 100px;
        }
        .main-table th:nth-child(1),
        .share-funds-table th:nth-child(1) {
            width: 200px;
        }
        .main-table th:nth-child(2),
        .share-funds-table th:nth-child(2) {
            width: 150px;
        }
        .main-table th, .main-table td,
        .share-funds-table th, .share-funds-table td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }
        .table-container::-webkit-scrollbar,
        .share-funds-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track,
        .share-funds-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb,
        .share-funds-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover,
        .share-funds-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .table-container,
        .share-funds-container {
            scrollbar-width: thin;
            scrollbar-color: #888 #f1f1f1;
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <h2>Select AMC and Scheme</h2>
        <div class="mb-3">
            <label>AMC:</label>
            <select id="amcDropdown" class="form-select"></select>
        </div>
        <div class="mb-3">
            <label>Scheme:</label>
            <select id="schemeDropdown" class="form-select"></select>
        </div>

        <div class="mb-3 d-flex flex-wrap gap-2">
            <button class="btn btn-warning" onclick="loadData('holding_percentage', this)">% of Total Holding</button>
            <button class="btn btn-danger" onclick="loadData('sector_holding', this)">Sector Wise Holding %</button>
            <button class="btn btn-dark" onclick="loadData('sector_holding_all', this)">Sector Wise Holding % (All AMCs)</button>
            <button class="btn btn-success" onclick="loadData('share_wise_shares_all', this)">Share Wise Number of Shares (All AMCs)</button>
            <button class="btn btn-primary" onclick="loadData('consolidated', this)">Consolidated View</button>
        </div>

        <hr>
        <div id="tableContainer" class="mt-4 table-container">
            <div id="loadingSpinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading data...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const amcDropdown = document.getElementById('amcDropdown');
            const schemeDropdown = document.getElementById('schemeDropdown');
            const tableContainer = document.getElementById('tableContainer');
            const loadingSpinner = document.getElementById('loadingSpinner');

            if (!amcDropdown || !schemeDropdown || !tableContainer || !loadingSpinner) {
                console.error('Required DOM elements not found');
                return;
            }

            try {
                const response = await fetch('/get_amcs');
                if (!response.ok) throw new Error(`Failed to fetch AMCs: ${response.statusText}`);
                const amcs = await response.json();
                console.log('AMCs loaded:', amcs);
                amcs.forEach(amc => {
                    const option = document.createElement('option');
                    option.text = amc;
                    option.value = amc;
                    amcDropdown.appendChild(option);
                });

                amcDropdown.addEventListener('change', async () => {
                    const selectedAMC = amcDropdown.value;
                    console.log('Selected AMC:', selectedAMC);
                    try {
                        const response = await fetch('/get_schemes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ amc: selectedAMC })
                        });
                        if (!response.ok) throw new Error(`Failed to fetch schemes: ${response.statusText}`);
                        const schemes = await response.json();
                        console.log('Schemes loaded:', schemes);
                        schemeDropdown.innerHTML = '';
                        schemes.forEach(scheme => {
                            const option = document.createElement('option');
                            option.text = scheme;
                            option.value = scheme;
                            schemeDropdown.appendChild(option);
                        });
                        tableContainer.innerHTML = '<div id="loadingSpinner" style="display: none;"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div><p>Loading data...</p></div>';
                    } catch (error) {
                        console.error('Error loading schemes:', error);
                        tableContainer.innerHTML = `<div class='text-danger'>Error loading schemes: ${error.message}</div>`;
                    }
                });

                if (amcs.length > 0) {
                    amcDropdown.dispatchEvent(new Event('change'));
                }
            } catch (error) {
                console.error('Error loading AMCs:', error);
                tableContainer.innerHTML = `<div class='text-danger'>Error loading AMCs: ${error.message}</div>`;
            }
        });

        async function loadData(view, button) {
            const amcDropdown = document.getElementById('amcDropdown');
            const schemeDropdown = document.getElementById('schemeDropdown');
            const tableContainer = document.getElementById('tableContainer');
            const loadingSpinner = document.getElementById('loadingSpinner');

            if (!amcDropdown || !schemeDropdown || !tableContainer || !loadingSpinner) {
                console.error('Required DOM elements not found');
                return;
            }

            if (view !== 'sector_holding_all' && view !== 'share_wise_shares_all' && view !== 'consolidated' && (!amcDropdown.value || !schemeDropdown.value)) {
                tableContainer.innerHTML = "<div class='text-danger'>Please select both AMC and Scheme</div>";
                return;
            }

            button.disabled = true;
            loadingSpinner.style.display = 'block';
            tableContainer.querySelectorAll('table, .text-danger, h4, .share-funds-row').forEach(el => el.remove());

            try {
                console.log('Fetching data for view:', view);
                const response = await fetch('/get_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        amc: amcDropdown.value, 
                        scheme: schemeDropdown.value, 
                        min_shares: 1,
                        view: view
                    })
                });

                if (!response.ok) throw new Error(`Failed to fetch data: ${response.statusText}`);

                const data = await response.json();
                console.log('Main table data received:', { htmlLength: data.html?.length });
                tableContainer.innerHTML = '<div id="loadingSpinner" style="display: none;"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div><p>Loading data...</p></div>';
                
                let html = data.html;
                if (view !== 'consolidated') {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const parsedTable = doc.querySelector('table');
                    if (parsedTable) {
                        parsedTable.classList.add('main-table');
                        const headers = parsedTable.querySelectorAll('th');
                        headers.forEach((header, index) => {
                            const headerText = header.textContent.trim();
                            if (headerText.toLowerCase() === 'sector' || headerText.toLowerCase() === 'share' || headerText.toLowerCase() === 'metric') {
                                header.innerHTML = `<span>${headerText}</span>`;
                            } else {
                                header.innerHTML = `
                                    <div class="sort-buttons">
                                        <span>${headerText}</span>
                                        <div>
                                            <button class="sort-btn asc" data-col="${index}" title="Sort Ascending"></button>
                                            <button class="sort-btn desc" data-col="${index}" title="Sort Descending"></button>
                                        </div>
                                    </div>`;
                            }
                        });
                        html = parsedTable.outerHTML;
                        const title = doc.querySelector('h4');
                        if (title) {
                            html = `<h4>${title.textContent}</h4><div style='display:block; overflow-x:auto; width:100%' class='table-container'>${html}</div>`;
                        }
                    } else {
                        console.error('No table found in main data HTML');
                        tableContainer.innerHTML = `<div class='text-danger'>No table data available</div>`;
                        return;
                    }
                }
                
                tableContainer.insertAdjacentHTML('beforeend', html);

                const tableElement = tableContainer.querySelector('table.main-table');
                if (tableElement && view !== 'consolidated') {
                    const sortButtons = tableElement.querySelectorAll('.sort-btn');
                    sortButtons.forEach(button => {
                        button.addEventListener('click', () => {
                            const colIndex = parseInt(button.getAttribute('data-col'));
                            const isAscending = button.classList.contains('asc');
                            sortTable(tableElement, colIndex, isAscending);
                        });
                    });

                    if (view === 'share_wise_shares_all') {
                        const shareCells = tableElement.querySelectorAll('tbody tr td:first-child');
                        console.log('Share cells found:', shareCells.length);
                        shareCells.forEach(cell => {
                            cell.classList.add('share-cell');
                            cell.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const shareName = cell.textContent.trim().replace(/\s+/g, ' ');
                                console.log('Clicked share:', JSON.stringify(shareName));
                                const row = cell.parentElement;
                                const existingRow = tableContainer.querySelector('.share-funds-row');
                                if (existingRow) {
                                    console.log('Hiding existing funds row');
                                    existingRow.classList.remove('show');
                                    setTimeout(() => existingRow.remove(), 300);
                                    return;
                                }

                                try {
                                    console.log('Sending fetch request for share:', shareName);
                                    const response = await fetch('/get_data_for_share_funds', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ share: shareName })
                                    });
                                    console.log('Fetch response status:', response.status, response.statusText);
                                    if (!response.ok) {
                                        const errorText = await response.text();
                                        console.error('Fetch error response:', errorText);
                                        throw new Error(`Failed to fetch funds data: ${response.statusText}`);
                                    }
                                    const data = await response.json();
                                    console.log('Funds data received:', { htmlLength: data.html?.length, htmlPreview: data.html?.substring(0, 200) });

                                    if (!data.html) {
                                        console.error('No HTML in funds data');
                                        tableContainer.insertAdjacentHTML('beforeend', `<div class='text-danger'>No funds data available for ${shareName}</div>`);
                                        return;
                                    }

                                    const parser = new DOMParser();
                                    const doc = parser.parseFromString(data.html, 'text/html');
                                    const fundsTable = doc.querySelector('table');
                                    if (!fundsTable) {
                                        console.error('No table in funds data HTML:', data.html.substring(0, 200));
                                        tableContainer.insertAdjacentHTML('beforeend', `<div class='text-danger'>No table data for ${shareName}. Raw response: ${data.html}</div>`);
                                        return;
                                    }

                                    const fundsContainer = document.createElement('div');
                                    fundsContainer.className = 'share-funds-container';
                                    fundsContainer.innerHTML = data.html;
                                    fundsTable.classList.add('share-funds-table');

                                    const mainTable = tableContainer.querySelector('.main-table');
                                    const headerCount = mainTable.querySelectorAll('th').length;
                                    const fundsRow = document.createElement('tr');
                                    fundsRow.className = 'share-funds-row';
                                    const fundsCell = document.createElement('td');
                                    fundsCell.colSpan = headerCount;
                                    fundsCell.appendChild(fundsContainer);
                                    row.insertAdjacentElement('afterend', fundsRow);
                                    fundsRow.appendChild(fundsCell);

                                    if (mainTable && fundsTable) {
                                        fundsTable.style.width = mainTable.offsetWidth + 'px';
                                        console.log('Main table width:', mainTable.offsetWidth, 'Funds table width:', fundsTable.offsetWidth);

                                        const mainHeaders = mainTable.querySelectorAll('th');
                                        const fundsHeaders = fundsTable.querySelectorAll('th');
                                        console.log('Main headers:', mainHeaders.length, 'Funds headers:', fundsHeaders.length);
                                        mainHeaders.forEach((mainTh, index) => {
                                            const fundsTh = fundsHeaders[index];
                                            if (fundsTh) {
                                                const width = mainTh.getBoundingClientRect().width;
                                                console.log(`Column ${index} width: ${width}`);
                                                fundsTh.style.width = width + 'px';
                                                fundsTh.style.minWidth = width + 'px';
                                                fundsTh.style.maxWidth = width + 'px';
                                            }
                                        });

                                        const fundsRows = fundsTable.querySelectorAll('tbody tr');
                                        fundsRows.forEach(row => {
                                            const cells = row.querySelectorAll('td');
                                            cells.forEach((cell, index) => {
                                                const mainTh = mainHeaders[index];
                                                if (mainTh) {
                                                    const width = mainTh.getBoundingClientRect().width;
                                                    cell.style.width = width + 'px';
                                                    cell.style.minWidth = width + 'px';
                                                    cell.style.maxWidth = width + 'px';
                                                }
                                            });
                                        });
                                    }

                                    console.log('Showing funds row');
                                    setTimeout(() => fundsContainer.classList.add('show'), 10);
                                    fundsRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                                    const hideTable = (event) => {
                                        if (!cell.contains(event.target) && !fundsContainer.contains(event.target)) {
                                            console.log('Hiding funds row');
                                            fundsContainer.classList.remove('show');
                                            setTimeout(() => fundsRow.remove(), 300);
                                            document.removeEventListener('click', hideTable);
                                        }
                                    };
                                    document.addEventListener('click', hideTable);
                                } catch (error) {
                                    console.error('Error in funds table rendering:', error);
                                    tableContainer.insertAdjacentHTML('beforeend', `<div class='text-danger'>Error loading funds data for ${shareName}: ${error.message}</div>`);
                                }
                            });
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading data:', error);
                tableContainer.innerHTML = '<div id="loadingSpinner" style="display: none;"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div><p>Loading data...</p></div>';
                tableContainer.insertAdjacentHTML('beforeend', `<div class='text-danger'>Error loading data: ${error.message}</div>`);
            } finally {
                button.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        }

        function sortTable(table, colIndex, isAscending) {
            const tbody = table.querySelector('tbody');
            if (!tbody) {
                console.warn('Table body not found');
                return;
            }
            const rows = Array.from(tbody.querySelectorAll('tr:not(.share-funds-row)'));
            if (rows.length === 0) {
                console.warn('No rows to sort');
                return;
            }

            const header = table.querySelectorAll('th')[colIndex];
            if (!header) {
                console.warn('Header not found for column index:', colIndex);
                return;
            }
            const buttons = header.querySelectorAll('.sort-btn');
            table.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            const activeButton = header.querySelector(isAscending ? '.sort-btn.asc' : '.sort-btn.desc');
            if (activeButton) activeButton.classList.add('active');

            const isNumeric = rows.every(row => {
                const cell = row.cells[colIndex];
                if (!cell) return false;
                const value = cell.textContent.trim();
                return !isNaN(parseFloat(value)) && isFinite(parseFloat(value));
            });

            rows.sort((rowA, rowB) => {
                const cellA = rowA.cells[colIndex];
                const cellB = rowB.cells[colIndex];
                if (!cellA || !cellB) return 0;
                let valueA = cellA.textContent.trim();
                let valueB = cellB.textContent.trim();

                if (isNumeric) {
                    const numA = parseFloat(valueA) || 0;
                    const numB = parseFloat(valueB) || 0;
                    return isAscending ? numA - numB : numB - numA;
                } else {
                    return isAscending
                        ? valueA.localeCompare(valueB)
                        : valueB.localeCompare(valueA);
                }
            });

            const existingFundsRow = table.querySelector('.share-funds-row');
            tbody.innerHTML = '';
            rows.forEach(row => {
                tbody.appendChild(row);
            });
            if (existingFundsRow) {
                tbody.appendChild(existingFundsRow);
            }
        }
    </script>
</body>
</html>
