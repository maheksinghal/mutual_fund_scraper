databases:
  - name: user_logins_db
    databaseName: user_logins_db
    plan: free
services:
  - type: web
    name: mf-dashboard
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: user_logins_db
          property: connectionString